<!doctype html>
<html lang="pt-BR">

		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				/* background-color: #0f172a; */
				color: #f8fafc;
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.container {
				width: 100%;
				max-width: 800px;
				background: #1e293b;
				border-radius: 12px;
				padding: 24px;
				box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
			}

			h1 {
				font-size: 1.4rem;
				margin-bottom: 16px;
				color: #38bdf8;
				text-align: center;
			}

			.player-wrapper {
				position: relative;
				width: 100%;
				aspect-ratio: 16 / 9;
				background-color: #000;
				border-radius: 8px;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			video {
				width: 100%;
				height: 100%;
				object-fit: contain;
			}

			.overlay {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: rgba(15, 23, 42, 0.92);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				padding: 20px;
				text-align: center;
				z-index: 10;
			}

			.btn-start {
				background: #0284c7;
				color: #fff;
				border: none;
				padding: 12px 28px;
				font-size: 1rem;
				font-weight: 600;
				border-radius: 6px;
				cursor: pointer;
				transition: background 0.2s;
			}

			.btn-start:hover {
				background: #0369a1;
			}

			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid rgba(255, 255, 255, 0.1);
				border-left-color: #38bdf8;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.stats {
				margin-top: 20px;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
				gap: 12px;
			}

			.stat-card {
				background: #0f172a;
				padding: 12px;
				border-radius: 6px;
				text-align: center;
			}

			.stat-card span {
				display: block;
				font-size: 0.8rem;
				color: #94a3b8;
			}

			.stat-card strong {
				font-size: 1.05rem;
				color: #f1f5f9;
			}

			.progress-bar-container {
				width: 100%;
				height: 8px;
				background: #334155;
				border-radius: 4px;
				margin-top: 16px;
				overflow: hidden;
			}

			.progress-bar {
				height: 100%;
				width: 0%;
				background: #38bdf8;
				transition: width 0.3s ease;
			}

			#log-box {
				margin-top: 16px;
				background: #0f172a;
				border-radius: 6px;
				padding: 12px;
				font-family: monospace;
				font-size: 0.8rem;
				color: #38bdf8;
				max-height: 90px;
				overflow-y: auto;
				text-align: left;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="player-wrapper">
				<video id="video-player" controls playsinline></video>
				<div id="overlay" class="overlay">
					<button id="btn-start" class="btn-start">
						▶ Iniciar Streaming
					</button>
					<div
						id="spinner"
						class="spinner"
						style="display: none"
					></div>
					<p id="status-text"></p>
				</div>
			</div>

			<div class="progress-bar-container">
				<div id="progress-bar" class="progress-bar"></div>
			</div>

			<div class="stats">
				<div class="stat-card">
					<span>Download</span>
					<strong id="download-speed"></strong>
				</div>
				<div class="stat-card">
					<span>Upload</span>
					<strong id="upload-speed"></strong>
				</div>
				<div class="stat-card">
					<span>Peers</span>
					<strong id="num-peers"></strong>
				</div>
				<div class="stat-card">
					<span>Progresso Vídeo</span>
					<strong id="progress-percent"></strong>
				</div>
			</div>

			<div id="log-box">Pronto.</div>
		</div>

tr=udp%3A%2F%2Ftracker.playground.ru%3A6969%2Fannounce&tr=udp%3A%2F%2Fbittorrent-tracker.e-n-c-r-y-p-t.net%3A1337%2Fannounce&tr=http%3A%2F%2Fipv4announce.sktorrent.eu%3A6969%2Fannounce&tr=http%3A%2F%2Ftracker.bittor.pw%3A1337%2Fannounce&tr=http%3A%2F%2Fbittorrent-tracker.e-n-c-r-y-p-t.net%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.skynetcloud.site%3A6969%2Fannounce&tr=udp%3A%2F%2Ftr.btube3.com%3A2010%2Fannounce&tr=udp%3A%2F%2Fopentracker.io%3A6969%2Fannounce&tr=wss%3A%2F%2Ftracker.openwebtorrent.com%3A443&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&tr=wss%3A%2F%2Ftracker.webtorrent.dev&tr=wss%3A%2F%2Fopen.ftorrent.com&tr=wss%3A%2F%2Ftracker.btorrent.xyz&tr=wss%3A%2F%2Ftracker.fastcast.nz&ws=https%3A%2F%2Fbafybeie4dlhmcaiymnuoegitr5rfz32offvf7nj4sizxdla5mfdyjd2fwq.ipfs.dweb.link%3Ffilename%3DSintel.mp4&ws=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2F";
			const videoPlayer = document.getElementById("video-player");
			const overlay = document.getElementById("overlay");
			const btnStart = document.getElementById("btn-start");
			const spinner = document.getElementById("spinner");
			const statusText = document.getElementById("status-text");
			const progressBar = document.getElementById("progress-bar");
			const logBox = document.getElementById("log-box");

			const downloadSpeedEl = document.getElementById("download-speed");
			const uploadSpeedEl = document.getElementById("upload-speed");
			const numPeersEl = document.getElementById("num-peers");
			const progressPercentEl =
				document.getElementById("progress-percent");

			function log(msg) {
				console.log(msg);
				logBox.innerText = `> ${msg}`;
			}

			btnStart.addEventListener("click", () => {
				btnStart.style.display = "none";
				spinner.style.display = "block";
				statusText.innerText = "Conectando aos peers do Sintel...";
				log("Iniciando WebTorrent...");

				const client = new WebTorrent();

				client.add(torrentUrl, function (torrent) {
					log("Torrent adicionado. Isolando arquivo de vídeo...");

					// torrent.files.forEach((file) => file.deselect()); // Desativa tudo para poupar banda e recursos

					// Acha apenas o MP4
					const videoFile = torrent.files.find((file) =>
						file.name.endsWith(".mp4"),
					);

					if (!videoFile) {
						statusText.innerText = "Vídeo MP4 não encontrado.";
						return;
					}

					log(
						`Arquivo selecionado: ${videoFile.name} (${(videoFile.length / 1024 / 1024).toFixed(2)} MB)`,
					);

					// Seleciona exclusivamente o vídeo e ativa o modo sequencial nativo
					videoFile.select();

					// Força prioridade imediata para o início (cabeçalho) e fim (metadados do MP4)
					const startPiece = Math.floor(videoFile._startPiece);
					const endPiece = Math.floor(videoFile._endPiece);

					torrent.critical(
						startPiece,
						Math.min(startPiece + 3, endPiece),
					);
					torrent.critical(
						Math.max(startPiece, endPiece - 3),
						endPiece,
					);

					log(
						`Priorizando início [${startPiece}] e fim [${endPiece}]`,
					);

					// Abordagem direta por MediaSource / Blob stream sequencial seguro
					videoFile.getBlobURL(function (err, url) {
						if (err) {
							log("Erro ao gerar Blob URL: " + err.message);
							statusText.innerText =
								"Erro ao criar stream do vídeo.";
							return;
						}

						log("Stream inicial obtido! Atribuindo ao player...");
						videoPlayer.src = url;
						videoPlayer
							.play()
							.then(() => {
								overlay.style.display = "none";
								log("Reprodução iniciada com sucesso!");
							})
							.catch((e) => {
								log(
									"Autoplay bloqueado pelo browser. Clique no play do player.",
								);
								overlay.style.display = "none";
							});
					});

					// Atualização contínua das estatísticas
					setInterval(() => {
						const progress = (videoFile.progress * 100).toFixed(1);
						progressBar.style.width = progress + "%";
						progressPercentEl.innerText = progress + "%";

						downloadSpeedEl.innerText =
							prettyBytes(torrent.downloadSpeed) + "/s";
						uploadSpeedEl.innerText =
							prettyBytes(torrent.uploadSpeed) + "/s";
						numPeersEl.innerText = torrent.numPeers;
					}, 500);
				});

				client.on("error", function (err) {
					log("Erro no cliente: " + err.message);
					statusText.innerText = "Erro: " + err.message;
				});
			});
			
			const mil = Math.log(1024);

			function prettyBytes(num) {
				const units = ["bits", "Kilobit", "Megabit"];
				if (num < 1) return "0 bit";
				const exponent = Math.min(
					Math.floor((Math.log(num) / mil * mil),),
					units.length - 1,
				);
				const approx = num / Math.pow(1024, exponent);
				return `${approx.toFixed(1)} ${units[exponent]}`;
			}
